name: Build Android 4.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android 4.4 branch
        uses: actions/checkout@v4
        with:
          ref: android-4.4
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Force Android 4.4 minimum SDK
        run: |
          sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 19/g' app/build.gradle || true
          sed -i 's/minSdk = [0-9][0-9]*/minSdk = 19/g' app/build.gradle.kts || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Save independent APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/dashcam-android-4.4.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # Dash Cam — Android 4.4

          APK مستقل لفرع Android 4.4:

          https://github.com/aljwaal1/dashcamapk/raw/android-4.4/apk/dashcam-android-4.4.apk
          EOF

      - name: Commit APK to Android 4.4 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin android-4.4
          git add apk/dashcam-android-4.4.apk DOWNLOAD_APK.md
          git commit -m "ci: update Android 4.4 APK" || echo "No changes"
          git push origin HEAD:android-4.4
