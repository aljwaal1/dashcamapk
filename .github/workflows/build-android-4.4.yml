name: Build Dashcam Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-android-4.4.yml']

permissions:
  contents: write

concurrency:
  group: dashcam-android-4-4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Lint and build signed debug APK
        run: |
          set -o pipefail
          gradle clean :app:lintDebug :app:assembleDebug --stacktrace --info --no-daemon 2>&1 | tee dashcam-build.log
      - name: Save and verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p apk
          cp "$APK" apk/dashcam-android-4.4.apk
          sha256sum apk/dashcam-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dashcam-android-4.4
          path: apk/dashcam-android-4.4.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-android-4.4-build-log
          path: dashcam-build.log
          if-no-files-found: ignore
      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/dashcam-android-4.4.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build signed Dashcam Android 4.4 APK'
            git pull --rebase origin android-4.4
            git push origin HEAD:android-4.4
          fi
