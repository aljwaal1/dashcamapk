plugins {
    id 'com.android.application'
}

android {
    namespace 'com.explapp.cardashcam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.explapp.cardashcam'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
