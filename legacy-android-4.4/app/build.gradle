plugins { id 'com.android.application' }

android {
    namespace 'com.explapp.dashcamlegacy'
    compileSdk 33
    defaultConfig {
        applicationId 'com.explapp.dashcamlegacy'
        minSdk 19
        targetSdk 28
        versionCode 2
        versionName '1.1.0-functional'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}